<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">

  <!-- KORIS ERP — K-Baobab Symbol (dark-bg optimized) -->

  <!-- TRUNK -->
  <line x1="110" y1="262" x2="110" y2="75"
        stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

  <!-- K UPPER ARM -->
  <line x1="110" y1="148" x2="168" y2="84"
        stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>

  <!-- K LOWER ARM -->
  <line x1="110" y1="148" x2="168" y2="212"
        stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>

  <!-- Upper sub-branches -->
  <line x1="168" y1="84" x2="196" y2="56"
        stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
  <line x1="168" y1="84" x2="208" y2="84"
        stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <line x1="168" y1="84" x2="168" y2="44"
        stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- Lower sub-branches -->
  <line x1="168" y1="212" x2="196" y2="240"
        stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <line x1="168" y1="212" x2="208" y2="212"
        stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>

  <!-- Crown branches -->
  <line x1="110" y1="75" x2="75" y2="40"
        stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <line x1="110" y1="75" x2="145" y2="40"
        stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>

  <!-- Terminal nodes -->
  <circle cx="196" cy="56" r="8" fill="#D4AF37"/>
  <circle cx="208" cy="84" r="8" fill="#2563EB"/>
  <circle cx="168" cy="44" r="8" fill="#2563EB"/>
  <circle cx="196" cy="240" r="8" fill="#2563EB"/>
  <circle cx="208" cy="212" r="8" fill="#D4AF37"/>
  <circle cx="75" cy="40" r="8" fill="#D4AF37"/>
  <circle cx="145" cy="40" r="8" fill="#2563EB"/>

</svg>
